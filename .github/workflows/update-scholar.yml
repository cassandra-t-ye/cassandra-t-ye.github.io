name: update-scholar

# Refreshes the Papers page from Google Scholar every Monday.
# Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch papers from Google Scholar
        # If Scholar blocks the request, keep the current list and don't fail.
        run: python3 bin/update_scholar.py || echo "Scholar fetch failed; keeping existing list."
      - name: Commit if the list changed
        run: |
          # Ignore the date stamp on line 1 when checking for changes
          if git diff -U0 _data/scholar.yml | grep '^[+-] ' | grep -qv 'Generated by'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/scholar.yml
            git commit -m "Update papers from Google Scholar"
            git push
            # Pushes made by this workflow don't trigger other workflows, so start the deploy here
            gh workflow run deploy.yml --ref ${{ github.ref_name }}
          else
            echo "No changes."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
